<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatifyInv – History</title>
<link rel="stylesheet" href="/catify.css">
</head>
<body data-page="history">
<header>
  <div><div class="eye" id="eye"></div><div class="brand">CatifyInv</div></div>
  <nav><a data-p="home" href="/">Home</a><a data-p="pantry" href="/pantry">Pantry</a><a data-p="history" href="/history">History</a></nav>
</header>
<main>
  <h1>History</h1>
  <div class="head" style="margin-top:20px"><h2>Monthly summary</h2></div>
  <p class="sub">Tap a month to filter the events below. Costs use each food's current price, so they are estimates.</p>
  <div class="panel scroll">
    <table><thead><tr><th>Month</th><th>Feedings</th><th>Units fed</th><th>Food eaten ≈</th><th>Purchased ≈</th></tr></thead><tbody id="monthRows"></tbody></table>
  </div>
  <div class="head">
    <h2>Events</h2>
    <div class="row"><label style="flex:0 1 180px"><select id="mFilter"></select></label>
    <label style="flex:0 1 160px"><select id="sFilter"><option value="">All events</option><option value="feed">Fed</option><option value="create">Added</option><option value="edit">Edited</option><option value="adjust">Adjusted</option><option value="delete">Deleted</option></select></label></div>
  </div>
  <div class="panel scroll">
    <table><thead><tr><th>When</th><th>Event</th><th>Food</th><th>Units</th><th>Stock</th></tr></thead><tbody id="logRows"></tbody></table>
  </div>
</main>
<script src="/catify.js"></script>
</body>
</html>
