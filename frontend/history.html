<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CatifyInv — Activity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-left">
    <p class="eyebrow">ACTIVITY</p>
    <h1>What's Changed</h1>
  </div>
  <a class="btn btn-ghost" href="/">&larr; Back to pantry</a>
</header>

<section class="toolbar">
  <input type="search" id="searchInput" placeholder="Search product or brand…" class="input search-input">

  <select id="sourceFilter" class="input select">
    <option value="">All change types</option>
    <option value="create">Added</option>
    <option value="adjust">Quick +/-</option>
    <option value="edit">Edited</option>
    <option value="delete">Removed</option>
  </select>
</section>

<main>
  <div id="emptyState" class="empty-state hidden">
    <p class="empty-title">Nothing here yet.</p>
    <p class="empty-sub">Add, use, or restock something and it'll show up here.</p>
  </div>

  <div class="history-table-wrap">
    <table class="history-table" id="historyTable">
      <thead>
        <tr>
          <th>When</th>
          <th>Product</th>
          <th>Brand</th>
          <th>Change</th>
          <th>Qty</th>
          <th>Type</th>
        </tr>
      </thead>
      <tbody id="historyTableBody"></tbody>
    </table>
  </div>
</main>

<script src="history.js"></script>
</body>
</html>
