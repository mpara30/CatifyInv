<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatifyInv</title>
<link rel="stylesheet" href="/catify.css">
</head>
<body data-page="home">
<header>
  <div><div class="eye" id="eye"></div><div class="brand">CatifyInv</div></div>
  <nav><a data-p="home" href="/">Home</a><a data-p="pantry" href="/pantry">Pantry</a><a data-p="history" href="/history">History</a></nav>
</header>
<main>
  <h1>Cat food inventory</h1>
  <p class="sub">What you have at home, what it cost, and who ate it.</p>
  <div class="stats" id="stats"></div>

  <div class="head"><h2>Feed a cat</h2></div>
  <div class="panel">
    <form id="feedForm" class="row">
      <label>Cat<select id="fCat"></select></label>
      <label>Food<select id="fFood"></select></label>
      <label style="flex:0 1 100px">Units<input id="fQty" type="number" min="1" step="1" value="1"></label>
      <button class="d">Feed</button>
    </form>
    <div id="feedMsg" class="sub" style="margin:10px 0 0"></div>
  </div>

  <div class="head"><h2>Our cats</h2><button class="d" id="openCat">+ Add cat</button></div>
  <div class="grid" id="catGrid"></div>

  <div class="head"><h2>Running low</h2><a class="btn" href="/pantry">Open pantry →</a></div>
  <div class="panel scroll">
    <table><thead><tr><th>Product</th><th>Stock</th><th>Use by</th><th>Value</th></tr></thead><tbody id="homeRows"></tbody></table>
  </div>
</main>

<dialog id="dCat">
  <form id="catForm"><h2>Add cat</h2>
    <label style="margin-top:12px">Cat name<input id="cName" required></label>
    <div class="acts"><button type="button" data-close>Cancel</button><button class="d">Add cat</button></div>
  </form>
</dialog>
<script src="/catify.js"></script>
</body>
</html>
